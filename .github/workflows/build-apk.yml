name: Build Duitku APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Allow audio autoplay in Android WebView
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/id/duitku/personal/MainActivity.java')
          s = p.read_text()
          marker = 'super.onCreate(savedInstanceState);'
          addition = marker + '\n        getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);'
          if marker in s and 'setMediaPlaybackRequiresUserGesture' not in s:
              p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Sync web app
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Duitku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
